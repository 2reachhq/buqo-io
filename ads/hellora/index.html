<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hellora – Ads</title>
  <link rel="stylesheet" href="fonts/inter.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #0c0c0e; }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      text-rendering: geometricPrecision; font-feature-settings: "cv11", "ss01";
    }

    /* ---------- Bühne (1080x1920) ---------- */
    #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
    .scene { position: absolute; inset: 0; display: none; overflow: hidden; }
    .el { opacity: 0; will-change: transform, opacity, filter; }

    /* Safe-Area: Reels/TikTok-Overlays oben & unten aussparen */
    .safe {
      position: absolute; left: 96px; right: 96px; top: 300px; bottom: 420px;
      display: flex; flex-direction: column; justify-content: center; align-items: flex-start; text-align: left;
    }
    .safe.center { align-items: center; text-align: center; }
    .safe.bottom { justify-content: flex-end; }
    .safe.top { justify-content: flex-start; }

    /* ---------- Typografie ---------- */
    .kicker { font-size: 40px; font-weight: 500; letter-spacing: -0.01em; color: var(--muted); margin-bottom: 30px; }
    .headline { font-size: 132px; font-weight: 700; letter-spacing: -0.045em; line-height: 1.02; }
    .headline.small { font-size: 96px; }
    .brand { font-size: 210px; font-weight: 700; letter-spacing: -0.055em; line-height: 1; }
    .brand.small { font-size: 136px; }
    .sub { font-size: 50px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.25; color: var(--muted); margin-top: 36px; max-width: 820px; }
    .word { display: inline-block; }
    .hl { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

    .wordwrap { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; }
    .bigword { font-size: 176px; font-weight: 700; letter-spacing: -0.05em; line-height: 1; }

    .list { width: 100%; margin-top: 40px; }
    .row { display: flex; align-items: baseline; gap: 40px; padding: 40px 0; border-top: 1px solid color-mix(in srgb, currentColor 14%, transparent); }
    .row:last-child { border-bottom: 1px solid color-mix(in srgb, currentColor 14%, transparent); }
    .idx { font-size: 36px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 64px; }
    .txt { font-size: 62px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.12; }

    .stat { white-space: nowrap; font-size: 300px; font-weight: 700; letter-spacing: -0.06em; line-height: 1; font-variant-numeric: tabular-nums; }

    .btn { margin-top: 64px; padding: 32px 72px; border-radius: 999px; font-size: 48px; font-weight: 600; letter-spacing: -0.02em; }
    .url { margin-top: 36px; font-size: 40px; font-weight: 500; color: var(--muted); letter-spacing: -0.01em; }

    /* ---------- Grafik ---------- */
    .glow { position: absolute; left: 50%; top: 50%; border-radius: 50%; filter: blur(96px); opacity: 0; pointer-events: none; will-change: transform, opacity; }
    .shapes { position: absolute; inset: 0; }
    .shape { position: absolute; }

    /* ---------- Vorschau im Browser ---------- */
    body.preview { display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
    body.preview #stage { transform-origin: center center; box-shadow: 0 40px 120px rgba(0,0,0,.6); border-radius: 0; cursor: pointer; }
    .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: rgba(128,128,128,.28); z-index: 999; }
    .bar .fill { height: 100%; width: 0; background: rgba(128,128,128,.9); }
    .ui { position: fixed; left: 16px; top: 16px; z-index: 1000; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      font: 500 13px/1 "Inter", system-ui, sans-serif; color: #bbb; }
    .ui a { color: #ddd; text-decoration: none; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,.08); }
    .ui a.on { background: #fff; color: #000; }
    .ui .hint { margin-left: 8px; color: #777; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <script src="ads.js"></script>
  <script src="engine.js"></script>
</body>
</html>
